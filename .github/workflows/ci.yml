name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build the library and run the full test suite under ASan + UBSan.
  # ---------------------------------------------------------------------------
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + sanitizers)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

  # ---------------------------------------------------------------------------
  # ThreadSanitizer. TSan and ASan are mutually exclusive, so the tests run
  # again in a dedicated build; a clean run shows the counter accesses are
  # race-free on both atomic backends the threaded tests force.
  # ---------------------------------------------------------------------------
  tsan:
    name: "ThreadSanitizer"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + thread sanitizer)
        run: meson setup build --buildtype=debug -Dbuild_tests=true -Db_sanitize=thread

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

  # ---------------------------------------------------------------------------
  # Verify the library compiles cleanly in release mode with no tests, the
  # configuration a downstream project would use.
  # ---------------------------------------------------------------------------
  release-build:
    name: "Release build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (release)
        run: meson setup build --buildtype=release -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Cross-build the library with the TI C2000 code generation tools, a
  # 16-bit-MAU target (CHAR_BIT == 16), under both object formats.
  # ---------------------------------------------------------------------------
  c2000:
    name: "TI C2000 (CGT ${{ matrix.cgt }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgt: "22.6.2"
            sha256: "9773f338df7b7314bc459be2cd9d9bf329786da8de6531f8f2d3d38c1e9f5750"
          - cgt: "25.11.1"
            sha256: "2f3a978e24a53279c9796ad374c32b530fc58fd085fd71288597846fe169c821"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Cache TI C2000 CGT
        id: cache-cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c2000-${{ matrix.cgt }}

      - name: Install TI C2000 CGT
        if: steps.cache-cgt.outputs.cache-hit != 'true'
        run: |
          bin="ti_cgt_c2000_${{ matrix.cgt }}.LTS_linux-x64_installer.bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$bin" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-xqxJ05PLfM/${{ matrix.cgt }}.LTS/$bin"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$bin"
          "$RUNNER_TEMP/$bin" --mode unattended --prefix "$HOME/ti"

      - name: Configure and build (COFF and EABI)
        run: |
          CGT="$HOME/ti/ti-cgt-c2000_${{ matrix.cgt }}.LTS"
          for abi in coffabi eabi; do
            cat > "c2000-$abi.ini" <<INI
          [binaries]
          c = '$CGT/bin/cl2000'
          ar = '$CGT/bin/ar2000'
          strip = '$CGT/bin/strip2000'

          [built-in options]
          c_args = ['-v28', '--float_support=fpu32', '--abi=$abi', '-I$CGT/include']

          [host_machine]
          system = 'bare-metal'
          cpu_family = 'c2000'
          cpu = 'c28x'
          endian = 'little'
          INI
            meson setup "build-$abi" --cross-file="c2000-$abi.ini" \
              -Dbuild_tests=false -Dwerror=true
            meson compile -C "build-$abi"
          done

  # ---------------------------------------------------------------------------
  # Enforce clang-format on all hand-written sources. scripts/format.sh pins
  # the clang-format release and runs it through uvx, so CI and local checks
  # use the same formatter whatever the runner's packages provide.
  # ---------------------------------------------------------------------------
  format:
    name: "clang-format"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Check formatting
        run: scripts/format.sh

  # ---------------------------------------------------------------------------
  # Code coverage gate. The suite reaches 100% line and branch coverage of
  # src/ and include/; the gate keeps it there.
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson, ninja and gcovr
        run: uv tool install meson && uv tool install ninja && uv tool install gcovr

      - name: Configure (coverage)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_coverage=true
          -Dc_args=-fprofile-update=atomic

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --verbose

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-branch 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ---------------------------------------------------------------------------
  # MISRA C:2023 static analysis via misch (cppcheck + misra addon), driven by
  # misra.toml. Each atomic backend is analysed: the default GNU __atomic
  # branch plus the c11-atomics and no-atomics profiles. The job fails only on
  # findings missing from that backend's baseline in analysis/baseline/. Rule
  # texts are never committed; set a MISRA_RULE_TEXTS secret for categorised
  # output. Without it, findings are still detected, only headlines are absent.
  # ---------------------------------------------------------------------------
  misra:
    name: "MISRA (misch)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck

      - name: Install meson, ninja and misch
        run: uv tool install meson && uv tool install ninja && uv tool install misch

      - name: Provide MISRA rule texts (optional secret)
        env:
          RULE_TEXTS: ${{ secrets.MISRA_RULE_TEXTS }}
        run: |
          if [ -n "$RULE_TEXTS" ]; then
            printf '%s\n' "$RULE_TEXTS" > "$RUNNER_TEMP/misra_rule_texts.txt"
            echo "MISRA_RULE_TEXTS=$RUNNER_TEMP/misra_rule_texts.txt" >> "$GITHUB_ENV"
          else
            echo "No MISRA_RULE_TEXTS secret; findings will be category: unknown."
          fi

      - name: Configure (compile database)
        run: meson setup build --buildtype=debug -Dbuild_tests=true

      - name: Analyse (default GNU __atomic backend)
        run: misch run --baseline -v

      - name: Analyse (C11 atomics profile)
        run: misch run --baseline --profile c11-atomics -v

      - name: Analyse (no-atomics profile)
        run: misch run --baseline --profile no-atomics -v
